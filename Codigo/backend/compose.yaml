services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flash_booking
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/flash_booking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RESERVATION_TTL: ${RESERVATION_TTL:-PT15M}
      EXPIRATION_SWEEP_INTERVAL_MS: ${EXPIRATION_SWEEP_INTERVAL_MS:-1000}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
